<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 企业私有知识库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial' font-size='24' font-weight='700' fill='white' text-anchor='middle'%3ERAG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(800px 500px at 12% -10%, rgba(59, 130, 246, 0.35), transparent 60%),
        radial-gradient(700px 500px at 100% 110%, rgba(124, 58, 237, 0.28), transparent 60%),
        linear-gradient(160deg, #0b1220, #111c33 60%, #0b1220);
    }
    .login-card {
      width: min(400px, calc(100vw - 32px));
      padding: 34px 32px 26px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.45);
      animation: rise .3s ease;
    }
    .login-brand { display: flex; align-items: center; gap: 12px; }
    .login-brand .logo { flex: none; }
    .login-brand h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
    .login-brand p { margin: 3px 0 0; font-size: 11.5px; color: #64748b; }
    .login-card > p { margin: 22px 0 18px; font-size: 13px; color: #64748b; }
    .login-card label { display: block; margin-bottom: 14px; }
    .login-card label span {
      display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: #475569;
    }
    .login-card input {
      width: 100%; padding: 11px 13px;
      font-size: 14px; color: #0f172a;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .login-card input:focus {
      background: #fff; border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, .12);
    }
    .login-error {
      min-height: 18px; margin: 2px 0 10px;
      font-size: 12px; color: #dc2626;
    }
    .login-btn {
      width: 100%; padding: 11px;
      font-size: 14px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: 0; border-radius: 11px; cursor: pointer;
      box-shadow: 0 10px 24px rgba(79, 70, 229, .28);
      transition: transform .18s, opacity .18s;
    }
    .login-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .login-btn:disabled { opacity: .55; cursor: not-allowed; }
    .login-footer {
      margin-top: 22px; padding-top: 16px;
      font-size: 10.5px; text-align: center; color: #94a3b8;
      border-top: 1px solid #eef2f7;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">RAG</div>
      <div>
        <h1>企业私有知识库</h1>
        <p>登录后访问内部资料与问答</p>
      </div>
    </div>

    <p>请使用管理员分配的账号登录。</p>

    <form id="loginForm" autocomplete="on">
      <label>
        <span>用户名</span>
        <input id="username" name="username" autocomplete="username" placeholder="请输入用户名" required>
      </label>
      <label>
        <span>密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </label>
      <div class="login-error" id="loginError"></div>
      <button class="login-btn" id="loginBtn" type="submit">登 录</button>
    </form>

    <div class="login-footer">资料与向量数据保存在企业内网 · 请勿共享账号</div>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
